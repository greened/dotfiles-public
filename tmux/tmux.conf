# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -, like emacs
bind | split-window -v -c '#{pane_current_path}'
bind - split-window -h -c '#{pane_current_path}'
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to
# use)
bind r source-file ~/.tmux.conf

# refit the current window to the attached terminal, clearing the padding
# "dots" left when a window is stuck smaller than the client.
#
# resize-window does the refit but, as a documented side effect, pins the
# window by setting its window-size to manual.  A pinned window then ignores
# the client forever: shrink the terminal and the window stays tall, so the
# bottom of it (a full-screen program's prompt, say) sits below the viewport,
# and detaching and reattaching cannot fix it.  So undo the pin right after,
# which keeps the size -A just computed while restoring automatic tracking.
bind R resize-window -A \; set-window-option -u window-size

# don't rename windows automatically
set-option -g allow-rename off

# Set terminal
set -g default-terminal "screen-256color"

# Setup windows

# Allow escape passthrough for emacs-libvterm directory tracking.
# allow-passthrough only exists in tmux 3.3+, so guard it or 3.2a errors on load.
# (Functional vterm dir-tracking through tmux needs 3.3+ anyway: `module load tmux/3.5a`.)
%if "#{>=:#{version},3.3}"
set -g allow-passthrough on
%endif

######################
### DESIGN CHANGES ###
######################

#
# Status bar
#

set -g status-interval 1
set -g status on
# tmux-powerline draws the bar from its config and theme, which link.sh
# deploys into ~/.config/tmux-powerline. Keep status-* formats out of here.
#
# Activity monitoring feeds the theme's activity colour. tmux marks activity
# and bell windows with a reverse style by default, which would invert the
# theme's colours, so leave those styles plain.
setw -g monitor-activity on
setw -g window-status-activity-style default
setw -g window-status-bell-style default

# List of plugins
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'erikw/tmux-powerline#v3.2.0'

# Bootstrap tpm on a fresh machine, then initialize it. A dangling link
# would make the clone fail, so remove one first. install_plugins aborts
# until tpm has run once, so run tpm before it.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'if [ -L ~/.tmux/plugins/tpm ]; then rm -f ~/.tmux/plugins/tpm; fi; git clone -b v3.1.0 --single-branch https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# --- Overlays: each repo in ~/lib/dotfiles-overlays/ drops tmux/*.conf here.
# -q = no error if none match.
source-file -q ~/lib/dotfiles-overlays/*/tmux/*.conf
